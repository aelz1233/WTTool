name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt ruff
      - run: ruff check .
      # Qt-free domain logic: metrics, alerts, fuel, profiles, aircraft database.
      - run: python -m unittest tests.test_aircraft tests.test_features -v
      # Hosted runners have no audio device, so only "Audio not loaded" is tolerated.
      - name: Self-check
        run: |
          python -m wtflight --self-check self-check-output
          $report = Get-Content self-check-output/self-check.json -Raw | ConvertFrom-Json
          $report | ConvertTo-Json
          $unexpected = @($report.errors | Where-Object { $_ -ne 'Audio not loaded' })
          if ($unexpected.Count -gt 0) { exit 1 }
          exit 0
