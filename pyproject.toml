[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-flight"
version = "1.0.13"
description = "Configurable War Thunder telemetry HUD and overlay"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.scripts]
wt-flight = "wtflight.app:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
