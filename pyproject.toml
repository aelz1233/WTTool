[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wtflight"
description = "Configurable War Thunder flight HUD and overlay editor for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.11,<7"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["ruff", "pyinstaller==6.22.3"]

[project.gui-scripts]
wt-flight = "wtflight.app:run"

[tool.setuptools.dynamic]
version = { attr = "wtflight.__version__" }

[tool.setuptools.packages.find]
include = ["wtflight*"]

[tool.setuptools.package-data]
wtflight = ["resources/*", "resources/flight_models/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes + syntax errors: catches broken imports and undefined names without
# forcing a style rewrite of the existing code.
select = ["F", "E9"]
